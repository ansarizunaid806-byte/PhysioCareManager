name: Build PhysioCare APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Grant execute permission for gradlew
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Extract SHA-1 Fingerprint
      run: |
        echo "=== Extracting SHA-1 from debug keystore ==="
        keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep "SHA1:" | sed 's/.*SHA1: //' > sha1.txt
        cat sha1.txt
        echo "==========================================="

    - name: Upload SHA-1
      uses: actions/upload-artifact@v4
      with:
        name: SHA1-Fingerprint
        path: sha1.txt
        retention-days: 30

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PhysioCareManager-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
